<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BMI Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #eef7ff, #f8f9fa);
        min-height: 100vh;
      }
      .calculator-card {
        max-width: 720px;
        border: 0;
        border-radius: 1rem;
      }
      .result-box {
        background: #f8f9fa;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">BMI Calculator</a>
        <div class="d-flex align-items-center gap-3">
          <span id="accountStatus" class="small text-muted"></span>
          <a id="loginLink" class="btn btn-outline-primary btn-sm" href="login.php">Login</a>
          <button id="logoutButton" class="btn btn-outline-secondary btn-sm d-none" type="button">Logout</button>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="card calculator-card shadow-lg mx-auto">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">BMI Calculator</h1>
            <p class="text-muted mb-0">
              Calculate your Body Mass Index quickly and easily.
            </p>
          </div>

          <div id="message" class="alert d-none" role="alert"></div>
          <form id="bmiForm" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="weight" class="form-label">Weight (kg)</label>
                <input
                  type="number"
                  class="form-control form-control-lg"
                  id="weight"
                  min="1"
                  step="0.1"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="height" class="form-label">Height (cm)</label>
                <input
                  type="number"
                  class="form-control form-control-lg"
                  id="height"
                  min="1"
                  step="0.1"
                  required
                />
              </div>
              <div class="col-12 d-grid mt-4">
                <button id="calculateButton" type="submit" class="btn btn-primary btn-lg">
                  Calculate BMI
                </button>
              </div>
            </div> 
          </form>

          <div
            id="result"
            class="result-box text-center p-4 mt-4 d-none"
            aria-live="polite"
          >
            <h2 class="h5 text-muted">Your BMI</h2>
            <div id="bmiValue" class="display-4 fw-bold text-primary"></div>
            <p id="bmiCategory" class="lead mb-0"></p>
          </div>

          <div class="mt-4">
            <h2 class="h5">BMI categories</h2>
            <div
              class="progress"
              style="height: 12px"
              aria-label="BMI categories"
            >
              <div class="progress-bar bg-info" style="width: 25%"></div>
              <div class="progress-bar bg-success" style="width: 25%"></div>
              <div class="progress-bar bg-warning" style="width: 25%"></div>
              <div class="progress-bar bg-danger" style="width: 25%"></div>
            </div>
            <div class="d-flex justify-content-between small text-muted mt-2">
              <span>Underweight<br />&lt; 18.5</span>
              <span>Normal<br />18.5–24.9</span>
              <span>Overweight<br />25–29.9</span>
              <span>Obese<br />30+</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document
        .getElementById("bmiForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const weight = Number(document.getElementById("weight").value);
          const height = Number(document.getElementById("height").value);
          const message = document.getElementById("message");
          if (weight <= 0 || height <= 0) {
            showMessage("Enter a valid weight and height.", "danger");
            return;
          }

          const button = document.getElementById("calculateButton");
          button.disabled = true;
          fetch("backend.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "calculate", weight, height })
          })
            .then((response) => response.json())
            .then((data) => {
              if (!data.success) throw new Error(data.message);
              document.getElementById("bmiValue").textContent = data.result.bmi.toFixed(1);
              document.getElementById("bmiCategory").textContent = data.result.category;
              document.getElementById("result").classList.remove("d-none");
              showMessage(data.message, "success");
            })
            .catch((error) => showMessage(error.message || "Unable to calculate BMI.", "danger"))
            .finally(() => { button.disabled = false; });
        });

      function showMessage(text, type) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = `alert alert-${type}`;
      }

      fetch("backend.php?action=me")
        .then((response) => response.json())
        .then((data) => {
          if (!data.authenticated) return;
          document.getElementById("accountStatus").textContent = data.user;
          document.getElementById("loginLink").classList.add("d-none");
          document.getElementById("logoutButton").classList.remove("d-none");
        });

      document.getElementById("logoutButton").addEventListener("click", () => {
        fetch("backend.php", { method: "POST", body: new URLSearchParams({ action: "logout" }) })
          .then(() => window.location.reload());
      });
    </script>
  </body>
</html>
